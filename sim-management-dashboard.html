play:flex;align-items:center;gap:13px;border-bottom:1px solid #edf0f5;padding:11px 0}.summary:last-child{border:0}.badge{padding:4px 8px;border-radius:14px;font-size:11px;font-weight:750;white-space:nowrap}.in-use{background:#e9f8f0;color:var(--g)}.available{background:#e9efff;color:#285fca}.blocked,.lost{background:#feeeee;color:var(--r)}.suspended,.pending-activation{background:#fff5e3;color:#a77412}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.search{min-width:260px;flex:1}table{width:100%;border-collapse:collapse}th{text-align:left;background:#f8f9fc;color:#758299;padding:11px 13px;font-size:10px;letter-spacing:.6px}td{padding:13px;border-top:1px solid #edf0f5;font-size:12px;vertical-align:top}.click{color:var(--b);font-weight:750;cursor:pointer}.muted{color:var(--m);font-size:11px}.empty{text-align:center;padding:42px;color:var(--m)}.tablewrap{overflow:auto}.modal{display:none;position:fixed;z-index:5;inset:0;background:#0b173280;place-items:center;padding:18px}.modal.show{display:grid}.dialog{width:min(700px,100%);max-height:92vh;overflow:auto;background:white;border-radius:12px}.dhead{padding:19px 22px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between}.dhead h2{margin:0;font-size:18px}.close{font-size:20px;background:#f1f3f8;padding:2px 10px}.form{padding:20px 22px;display:grid;grid-template-columns:1fr 1fr;gap:14px}.form label{font-size:11px;font-weight:800;color:#64718a;display:block;margin-bottom:5px}.form input,.form select,.form textarea{border:1px solid #d9e0ec;width:100%;border-radius:7px;padding:9px}.form textarea{min-height:65px}.wide{grid-column:1/-1}.actions{padding:0 22px 20px;display:flex;justify-content:flex-end;gap:8px}.timeline{padding:3px 8px}.event{border-left:2px solid #dae5fd;padding:0 0 18px 17px;position:relative}.event:before{content:"";position:absolute;width:9px;height:9px;background:#356cf5;border-radius:50%;left:-5.5px;top:3px}.tabs{display:flex;gap:20px;border-bottom:1px solid var(--l);margin-bottom:16px}.tab{padding:8px 1px 10px;border-bottom:2px solid transparent;font-weight:700;color:var(--m);cursor:pointer}.tab.active{border-color:var(--b);color:var(--b)}.hidden{display:none}@media(max-width:850px){.side{width:58px;padding:23px 6px}.brand{font-size:0;padding-left:7px}.brand .mark{margin:0}.nav{font-size:0;padding:12px}.nav:first-letter{font-size:15px}.group,.user{display:none}.main{margin-left:58px;width:calc(100% - 58px)}.grid{grid-template-columns:repeat(3,1fr)}.split{grid-template-columns:1fr}}@media(max-width:600px){.side{display:none}.main{margin:0;width:100%}.content,.top{padding-left:15px;padding-right:15px}.grid{grid-template-columns:repeat(2,1fr)}.head{align-items:start;flex-direction:column;gap:12px}.form{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><span class="mark">▣</span>SIMHQ</div><div class="group">WORKSPACE</div><div class="nav active" data-p="dashboard">⌂&nbsp; Dashboard</div><div class="group">MANAGEMENT</div><div class="nav" data-p="sims">▤&nbsp; SIM Cards</div><div class="nav" data-p="agents">♙&nbsp; Agents</div><div class="nav" data-p="usage">◷&nbsp; Weekly Usage</div><div class="group">SYSTEM</div><div class="nav" data-p="audit">◉&nbsp; Audit Log</div><div class="nav" data-p="reports">⇩&nbsp; Reports</div><div class="user"><b>Alex Otieno</b><br>Administrator</div></aside><main class="main"><header class="top"><b id="crumb">Dashboard</b><select id="role" class="role"><option value="admin">Admin view</option><option value="supervisor">Supervisor view</option><option value="team_leader">Team Leader view</option><option value="agent">Agent view</option></select></header><div class="content" id="app"></div></main></div><div class="modal" id="modal"><div class="dialog" id="dialog"></div></div>
<script>
const K='simhq-local-v2',now=()=>new Date().toISOString(),dt=x=>new Date(x).toLocaleString('en-KE',{dateStyle:'medium',timeStyle:'short'}),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let d=JSON.parse(localStorage.getItem(K)||'null')||{sims:[{id:'s1',number:'0712 345 678',msisdn:'0712345678',iccid:'8925400000003812',network:'Safaricom',type:'Prepaid',status:'in-use',agent:'John Mwangi',agentId:'AGT-1042',team:'Field Sales Nairobi',assignedAt:'2026-01-03T10:12:00Z',createdAt:'2026-01-01T08:31:00Z',balance:240,history:[{at:'2026-08-20T14:26:00Z',action:'Agent transferred to Field Sales Nairobi',by:'Grace Njeri',note:'Team relationship updated; SIM history retained.'},{at:'2026-01-03T10:12:00Z',action:'Assigned to John Mwangi · Available → In Use',by:'Alex Otieno',note:'Initial operational assignment.'}]},{id:'s2',number:'0733 802 951',msisdn:'0733802951',iccid:'8925400000007719',network:'Airtel',type:'Prepaid',status:'in-use',agent:'Mary Wanjiku',agentId:'AGT-1089',team:'Customer Care',assignedAt:'2026-05-10T10:00:00Z',createdAt:'2026-04-29T08:31:00Z',balance:110,history:[{at:'2026-05-10T10:00:00Z',action:'Assigned to Mary Wanjiku · Available → In Use',by:'Alex Otieno',note:'Customer Care onboarding.'}]},{id:'s3',number:'0701 198 304',msisdn:'0701198304',iccid:'8925400000001544',network:'Telkom',type:'Prepaid',status:'available',agent:'',agentId:'',team:'Inventory',assignedAt:'',createdAt:'2026-08-22T08:31:00Z',balance:0,history:[{at:'2026-08-22T08:31:00Z',action:'Added to inventory',by:'Alex Otieno',note:'Awaiting assignment.'}]}],usage:[],audit:[]};let page='dashboard';const save=()=>localStorage.setItem(K,JSON.stringify(d)),write=()=>role.value!=='agent',audit=(action,obj,note)=>{d.audit.unshift({at:now(),action,obj,note,by:'Alex Otieno'});save()},badge=s=>`<span class="badge ${e(s)}">${e(s.replaceAll('-',' ').replace(/\b\w/g,x=>x.toUpperCase()))}</span>`;
function render(){crumb.textContent=page==='sims'?'SIM Cards':page==='agents'?'Agents':page==='usage'?'Weekly Usage':page==='audit'?'Audit Log':page==='reports'?'Reports':'Dashboard';document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.p===page));({dashboard,sims,agents,usage,audit:audits,reports})[page]()}
function dashboard(){let a=d.sims.filter(x=>x.status==='available').length,u=d.sims.filter(x=>x.status==='in-use').length,n=d.sims.filter(x=>['blocked','lost','suspended'].includes(x.status)).length;app.innerHTML=`<div class="head"><div><h1>SIM operations overview</h1><p>Data persists locally in this browser.</p></div>${write()?'<button class="primary" onclick="newSim()">+ Add SIM card</button>':''}</div><div class="grid"><div class="stat"><div class="label">TOTAL SIMS</div><div class="num">${d.sims.length}</div></div><div class="stat"><div class="label">IN USE</div><div class="num">${u}</div></div><div class="stat"><div class="label">AVAILABLE</div><div class="num">${a}</div></div><div class="stat"><div class="label">ATTENTION</div><div class="num" style="color:#bd8a20">${n}</div></div><div class="stat"><div class="label">WEEKLY RECORDS</div><div class="num">${d.usage.length}</div></div></div><div class="split"><div class="card"><h2>Recent SIM activity</h2>${d.sims.flatMap(s=>s.history.slice(0,1).map(h=>`<div class="summary">${badge(s.status)}<div><b>${e(h.action)}</b><div class="muted">${dt(h.at)} · ${e(h.by)}</div></div></div>`)).slice(0,5).join('')}</div><div class="card"><h2>Quick actions</h2><div class="summary"><div><b>Manage inventory</b><div class="muted">Add SIMs and prevent duplicate identifiers.</div></div>${write()?'<button class="secondary" onclick="newSim()">Add</button>':''}</div><div class="summary"><div><b>Open SIM history</b><div class="muted">Assignments and status changes are retained.</div></div><button class="secondary" onclick="go('sims')">View</button></div><div class="summary"><div><b>Submit weekly usage</b><div class="muted">Creates a permanent weekly record.</div></div>${write()?'<button class="secondary" onclick="go(\'usage\')">Record</button>':''}</div></div></div>`}
function sims(){app.innerHTML=`<div class="head"><div><h1>SIM cards</h1><p>Search, assign, update status, and retain full history.</p></div>${write()?'<button class="primary" onclick="newSim()">+ Add SIM card</button>':''}</div><div class="card"><div class="toolbar"><input id="q" class="field search" placeholder="Search SIM, ICCID, agent, team, network" oninput="list()"><select id="sf" class="field" onchange="list()"><option value="">All statuses</option><option>available</option><option>in-use</option><option>blocked</option><option>lost</option><option>suspended</option></select><button class="secondary" onclick="csv()">⇩ CSV</button></div><div class="tablewrap"><table><thead><tr><th>SIM NUMBER</th><th>AGENT / TEAM</th><th>NETWORK</th><th>STATUS</th><th>ASSIGNED</th><th>LAST EVENT</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div>`;list()}
function list(){let q=(document.getElementById('q')?.value||'').toLowerCase(),f=document.getElementById('sf')?.value;let z=d.sims.filter(s=>(!f||s.status===f)&&Object.values(s).join(' ').toLowerCase().includes(q));rows.innerHTML=z.length?z.map(s=>`<tr><td><span class="click" onclick="profile('${s.id}')">${e(s.number)}</span><br><span class="muted">${e(s.iccid)}</span></td><td>${s.agent?`<b>${e(s.agent)}</b><br><span class="muted">${e(s.team)}</span>`:'<span class="muted">Unassigned · Inventory</span>'}</td><td>${e(s.network)}</td><td>${badge(s.status)}</td><td>${s.assignedAt?dt(s.assignedAt):'—'}</td><td>${s.history[0]?dt(s.history[0].at):'—'}</td><td><button class="secondary" onclick="profile('${s.id}')">Open</button></td></tr>`).join(''):'<tr><td colspan="7" class="empty">No SIM cards match your search.</td></tr>'}
function newSim(){open(`<div class="dhead"><h2>Add SIM card</h2>${x()}</div><form class="form" onsubmit="create(event)"><div><label>SIM NUMBER *</label><input name="number" required></div><div><label>ICCID *</label><input name="iccid" required></div><div><label>PHONE / MSISDN</label><input name="msisdn"></div><div><label>NETWORK *</label><input name="network" required></div><div><label>SIM TYPE</label><input name="type" value="Prepaid"></div><div><label>INITIAL STATUS</label><select name="status"><option value="available">Available</option><option value="pending-activation">Pending Activation</option></select></div><div class="wide"><label>NOTES</label><textarea name="notes"></textarea></div><div class="wide actions"><button type="button" class="secondary" onclick="close()">Cancel</button><button class="primary">Save SIM card</button></div></form>`)}function create(ev){ev.preventDefault();let f=Object.fromEntries(new FormData(ev.target));if(d.sims.some(s=>s.number===f.number||s.iccid===f.iccid||(f.msisdn&&s.msisdn===f.msisdn))){alert('Duplicate SIM number, ICCID, or MSISDN.');return}let s={id:'s'+Date.now(),...f,agent:'',agentId:'',team:'Inventory',assignedAt:'',createdAt:now(),balance:0,history:[{at:now(),action:'Added to inventory',by:'Alex Otieno',note:f.notes||'Created from inventory form.'}]};d.sims.unshift(s);audit('SIM created',s.number,'Created inventory record');save();close();go('sims')}
function profile(id){let s=d.sims.find(x=>x.id===id);open(`<div class="dhead"><div><h2>${e(s.number)}</h2><div class="muted">${e(s.network)} · ICCID ${e(s.iccid)}</div></div>${x()}</div><div style="padding:18px 22px"><div class="grid" style="grid-template-columns:repeat(3,1fr)"><div><div class="label">STATUS</div>${badge(s.status)}</div><div><div class="label">CURRENT AGENT</div><b>${e(s.agent||'Unassigned')}</b></div><div><div class="label">TEAM</div><b>${e(s.team)}</b></div></div><div class="tabs"><div class="tab active" onclick="tab('time',this)">Timeline</div><div class="tab" onclick="tab('info',this)">Details</div></div><div id="time" class="timeline">${s.history.map(h=>`<div class="event"><strong>${e(h.action)}</strong><div class="muted">${dt(h.at)} · ${e(h.by)}</div><div class="muted">${e(h.note)}</div></div>`).join('')}</div><div id="info" class="hidden"><p><b>MSISDN:</b> ${e(s.msisdn||'—')}</p><p><b>SIM type:</b> ${e(s.type||'—')}</p><p><b>Balance:</b> KES ${Number(s.balance||0).toLocaleString()}</p><p><b>Added:</b> ${dt(s.createdAt)}</p></div></div>${write()?`<div class="actions"><button class="secondary" onclick="usageFor('${id}')">Record usage</button><button class="secondary" onclick="statusFor('${id}')">Update status</button><button class="primary" onclick="assignFor('${id}')">${s.agent?'Reassign SIM':'Assign SIM'}</button></div>`:''}`)}
function assignFor(id){let s=d.sims.find(x=>x.id===id);open(`<div class="dhead"><h2>${s.agent?'Reassign':'Assign'} ${e(s.number)}</h2>${x()}</div><form class="form" onsubmit="assign(event,'${id}')"><div><label>AGENT NAME *</label><input name="agent" required value="${e(s.agent)}"></div><div><label>AGENT ID</label><input name="agentId" value="${e(s.agentId)}"></div><div><label>TEAM *</label><input name="team" required value="${e(s.team==='Inventory'?'':s.team)}"></div><div><label>ASSIGNMENT DATE</label><input type="datetime-local" name="at" value="${now().slice(0,16)}"></div><div class="wide"><label>REASON *</label><textarea name="note" required></textarea></div><div class="wide actions"><button type="button" class="secondary" onclick="profile('${id}')">Cancel</button><button class="primary">Confirm assignment</button></div></form>`)}function assign(ev,id){ev.preventDefault();let f=Object.fromEntries(new FormData(ev.target)),s=d.sims.find(x=>x.id===id),old=s.agent,prev=s.status;s.agent=f.agent;s.agentId=f.agentId;s.team=f.team;s.assignedAt=new Date(f.at).toISOString();s.status='in-use';s.history.unshift({at:s.assignedAt,action:`${old?'Reassigned from '+old+' to':'Assigned to'} ${f.agent}${prev!=='in-use'?' · '+prev+' → In Use':''}`,by:'Alex Otieno',note:f.note});audit('SIM assignment',s.number,`Assigned to ${f.agent}`);save();profile(id)}
function statusFor(id){let s=d.sims.find(x=>x.id===id);open(`<div class="dhead"><h2>Update status · ${e(s.number)}</h2>${x()}</div><form class="form" onsubmit="status(event,'${id}')"><div><label>NEW STATUS *</label><select name="status">${['available','in-use','blocked','lost','damaged','suspended','disposed','returned','pending-activation'].map(q=>`<option ${q===s.status?'selected':''}>${q}</option>`).join('')}</select></div><div><label>EFFECTIVE DATE</label><input type="datetime-local" name="at" value="${now().slice(0,16)}"></div><div class="wide"><label>REASON / COMMENTS *</label><textarea name="note" required></textarea></div><div class="wide actions"><button type="button" class="secondary" onclick="profile('${id}')">Cancel</button><button class="primary">Save status change</button></div></form>`)}function status(ev,id){ev.preventDefault();let f=Object.fromEntries(new FormData(ev.target)),s=d.sims.find(x=>x.id===id),old=s.status;s.status=f.status;s.history.unshift({at:new Date(f.at).toISOString(),action:`Status changed ${old} → ${f.status}`,by:'Alex Otieno',note:f.note});audit('SIM status updated',s.number,`${old} to ${f.status}`);save();profile(id)}
function agents(){let a={};d.sims.forEach(s=>{if(s.agent)(a[s.agent]??=[]).push(s)});app.innerHTML=`<div class="head"><div><h1>Agents</h1><p>Active SIM cards and historical profiles.</p></div></div><div class="card tablewrap"><table><thead><tr><th>AGENT</th><th>TEAM</th><th>ACTIVE SIMS</th><th>SIM HISTORY</th></tr></thead><tbody>${Object.entries(a).map(([n,z])=>`<tr><td><b>${e(n)}</b><br><span class="muted">${e(z[0].agentId||'No ID')}</span></td><td>${e(z[0].team)}</td><td>${z.filter(s=>s.status==='in-use').length}</td><td>${z.map(s=>`<span class="click" onclick="profile('${s.id}')">${e(s.number)}</span>`).join(', ')}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No SIMs assigned yet.</td></tr>'}</tbody></table></div>`}
function usage(){app.innerHTML=`<div class="head"><div><h1>Weekly usage</h1><p>Every entry is a permanent weekly historical record.</p></div>${write()?'<button class="primary" onclick="usageFor()">+ Record weekly usage</button>':''}</div><div class="card tablewrap"><table><thead><tr><th>WEEK</th><th>SIM / AGENT</th><th>TEAM</th><th>AIRTIME</th><th>DATA MB</th><th>TOTAL SPEND</th><th>BY</th></tr></thead><tbody>${d.usage.map(u=>`<tr><td>${e(u.week)}</td><td><b>${e(u.number)}</b><br><span class="muted">${e(u.agent)}</span></td><td>${e(u.team)}</td><td>KES ${e(u.airtime)}</td><td>${e(u.data)}</td><td>KES ${e(u.total)}</td><td>${e(u.by)}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">No weekly usage records submitted.</td></tr>'}</tbody></table></div>`}
function usageFor(id){let s=id?d.sims.find(x=>x.id===id):d.sims[0];open(`<div class="dhead"><h2>Record weekly usage</h2>${x()}</div><form class="form" onsubmit="addUsage(event)"><div><label>SIM *</label><select name="sim">${d.sims.map(q=>`<option value="${q.id}" ${q.id===s?.id?'selected':''}>${e(q.number)} · ${e(q.agent||'Unassigned')}</option>`).join('')}</select></div><div><label>WEEK STARTING *</label><input type="date" name="week" required></div><div><label>AIRTIME (KES)</label><input name="airtime" type="number" min="0" value="0"></div><div><label>SMS BUNDLE (KES)</label><input name="sms" type="number" min="0" value="0"></div><div><label>CALLS (KES)</label><input name="calls" type="number" min="0" value="0"></div><div><label>DATA BUNDLE (KES)</label><input name="bundle" type="number" min="0" value="0"></div><div><label>DATA USED (MB)</label><input name="data" type="number" min="0" value="0"></div><div><label>SMS USED</label><input name="smsUsed" type="number" min="0" value="0"></div><div class="wide"><label>NOTES</label><textarea name="note"></textarea></div><div class="wide actions"><button type="button" class="secondary" onclick="close()">Cancel</button><button class="primary">Save weekly record</button></div></form>`)}function addUsage(ev){ev.preventDefault();let f=Object.fromEntries(new FormData(ev.target)),s=d.sims.find(x=>x.id===f.sim),total=['airtime','sms','calls','bundle'].reduce((z,k)=>z+Number(f[k]||0),0);d.usage.unshift({...f,number:s.number,agent:s.agent||'Unassigned',team:s.team,total,by:'Alex Otieno',at:now()});s.history.unshift({at:now(),action:'Weekly usage record submitted',by:'Alex Otieno',note:`Week of ${f.week} · KES ${total} total spend.`});audit('Weekly usage submitted',s.number,`Week starting ${f.week}`);save();close();go('usage')}
function audits(){app.innerHTML=`<div class="head"><div><h1>Audit log</h1><p>Operational actions recorded by this application.</p></div></div><div class="card tablewrap"><table><thead><tr><th>DATE / TIME</th><th>ACTION</th><th>RECORD</th><th>DETAIL</th><th>USER</th></tr></thead><tbody>${d.audit.map(a=>`<tr><td>${dt(a.at)}</td><td><b>${e(a.action)}</b></td><td>${e(a.obj)}</td><td>${e(a.note)}</td><td>${e(a.by)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No audited changes yet.</td></tr>'}</tbody></table></div>`}function reports(){app.innerHTML=`<div class="head"><div><h1>Reports</h1><p>Download current SIM inventory for analysis.</p></div></div><div class="card"><h2>Inventory export</h2><p class="muted">Exports SIM identifiers, assignment, team, status, and dates in CSV format.</p><button class="primary" onclick="csv()">⇩ Download SIM inventory CSV</button></div>`}
function csv(){let c=['number','msisdn','iccid','network','type','status','agent','agentId','team','assignedAt','createdAt','balance'],out=[c.join(','),...d.sims.map(s=>c.map(k=>'"'+String(s[k]??'').replaceAll('"','""')+'"').join(','))].join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'text/csv'}));a.download='sim-inventory.csv';a.click();audit('Report generated','SIM inventory','CSV export')}function open(h){dialog.innerHTML=h;modal.classList.add('show')}function close(){modal.classList.remove('show')}function x(){return '<button class="close" onclick="close()">×</button>'}function tab(id,el){document.querySelectorAll('#dialog .tab').forEach(a=>a.classList.remove('active'));el.classList.add('active');['time','info'].forEach(a=>document.getElementById(a).classList.toggle('hidden',a!==id))}function go(p){page=p;render()}document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>go(n.dataset.p));role.onchange=render;modal.onclick=q=>{if(q.target===modal)close()};render();
</script>
<script>
/* Team management extension: records team ownership and agent transfer history. */
d.teams??=[{id:'t1',name:'Field Sales Nairobi',leader:'Grace Njeri',active:true},{id:'t2',name:'Customer Care',leader:'David Ouma',active:true},{id:'t3',name:'Inventory',leader:'Alex Otieno',active:true}];
d.agentHistory??=[];save();
const systemHeading=[...document.querySelectorAll('.group')].find(x=>x.textContent==='SYSTEM');
if(!document.querySelector('[data-p="teams"]')){let n=document.createElement('div');n.className='nav';n.dataset.p='teams';n.textContent='♧  Teams';systemHeading.before(n);n.onclick=()=>go('teams')}
function teamOf(agent){return d.sims.find(s=>s.agent===agent)?.team||'Unassigned'}
function teamPage(){let cards=d.teams.map(t=>{let members=[...new Set(d.sims.filter(s=>s.team===t.name&&s.agent).map(s=>s.agent))],sims=d.sims.filter(s=>s.team===t.name);return `<div class="card" style="margin-top:0"><div style="display:flex;justify-content:space-between"><div><h2>${e(t.name)}</h2><div class="muted">Team leader: ${e(t.leader)}</div></div>${t.active?'<span class="badge in-use">Active</span>':'<span class="badge suspended">Inactive</span>'}</div><div class="grid" style="grid-template-columns:repeat(2,1fr);margin-top:20px"><div><div class="label">AGENTS</div><div class="num">${members.length}</div></div><div><div class="label">SIM CARDS</div><div class="num">${sims.length}</div></div></div><div class="muted" style="margin-top:13px">${members.length?members.map(e).join(', '):'No agents currently assigned.'}</div></div>`}).join('');app.innerHTML=`<div class="head"><div><h1>Teams</h1><p>Each team has a designated leader, agents, and SIM-card inventory.</p></div>${write()?'<button class="primary" onclick="newTeam()">+ Add team</button>':''}</div><div class="grid" style="grid-template-columns:repeat(3,1fr)">${cards}</div><div class="card"><h2>Agent transfer history</h2><div class="tablewrap"><table><thead><tr><th>DATE / TIME</th><th>AGENT</th><th>FROM TEAM</th><th>TO TEAM</th><th>TEAM LEADER</th><th>REASON</th></tr></thead><tbody>${d.agentHistory.map(h=>`<tr><td>${dt(h.at)}</td><td><b>${e(h.agent)}</b><br><span class="muted">${e(h.agentId||'')}</span></td><td>${e(h.from)}</td><td>${e(h.to)}</td><td>${e(h.leader)}</td><td>${e(h.note)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No agent transfers recorded.</td></tr>'}</tbody></table></div></div>`}
function newTeam(){open(`<div class="dhead"><h2>Add team</h2>${x()}</div><form class="form" onsubmit="createTeam(event)"><div><label>TEAM NAME *</label><input name="name" required></div><div><label>TEAM LEADER *</label><input name="leader" required></div><div class="wide"><label>NOTES</label><textarea name="note"></textarea></div><div class="wide actions"><button type="button" class="secondary" onclick="close()">Cancel</button><button class="primary">Create team</button></div></form>`)}
function createTeam(ev){ev.preventDefault();let f=Object.fromEntries(new FormData(ev.target));if(d.teams.some(t=>t.name.toLowerCase()===f.name.toLowerCase())){alert('A team with this name already exists.');return}d.teams.push({id:'t'+Date.now(),name:f.name,leader:f.leader,active:true});audit('Team created',f.name,`Team leader: ${f.leader}`);save();close();go('teams')}
function transferAgent(agent){let old=teamOf(agent),sim=d.sims.find(s=>s.agent===agent);open(`<div class="dhead"><h2>Transfer ${e(agent)}</h2>${x()}</div><form class="form" onsubmit="saveTransfer(event,'${e(agent)}')"><div><label>CURRENT TEAM</label><input disabled value="${e(old)}"></div><div><label>NEW TEAM *</label><select name="team">${d.teams.filter(t=>t.active&&t.name!==old).map(t=>`<option value="${e(t.name)}">${e(t.name)} · ${e(t.leader)}</option>`).join('')}</select></div><div class="wide"><label>REASON / NOTES *</label><textarea name="note" required placeholder="Reason for this transfer"></textarea></div><div class="wide actions"><button type="button" class="secondary" onclick="close()">Cancel</button><button class="primary">Transfer agent</button></div></form>`)}
function saveTransfer(ev,agent){ev.preventDefault();let f=Object.fromEntries(new FormData(ev.target)),old=teamOf(agent),team=d.teams.find(t=>t.name===f.team),items=d.sims.filter(s=>s.agent===agent);items.forEach(s=>{s.team=f.team;s.history.unshift({at:now(),action:`Agent transferred ${old} → ${f.team}`,by:'Alex Otieno',note:f.note})});d.agentHistory.unshift({at:now(),agent,agentId:items[0]?.agentId,from:old,to:f.team,leader:team?.leader||'',note:f.note});audit('Agent transferred',agent,`${old} to ${f.team}`);save();close();go('teams')}
function agents(){let a={};d.sims.forEach(s=>{if(s.agent)(a[s.agent]??=[]).push(s)});app.innerHTML=`<div class="head"><div><h1>Agents</h1><p>Agents are owned by teams and can hold multiple SIM cards.</p></div></div><div class="card tablewrap"><table><thead><tr><th>AGENT</th><th>CURRENT TEAM</th><th>ACTIVE SIMS</th><th>SIM RECORDS</th><th></th></tr></thead><tbody>${Object.entries(a).map(([n,z])=>`<tr><td><b>${e(n)}</b><br><span class="muted">${e(z[0].agentId||'No ID')}</span></td><td>${e(teamOf(n))}</td><td>${z.filter(s=>s.status==='in-use').length}</td><td>${z.map(s=>`<span class="click" onclick="profile('${s.id}')">${e(s.number)}</span>`).join(', ')}</td><td>${write()?`<button class="secondary" onclick="transferAgent('${e(n)}')">Transfer</button>`:''}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No SIMs assigned yet.</td></tr>'}</tbody></table></div>`}
const originalRender=render;render=function(){let labels={teams:'Teams'};if(labels[page]){crumb.textContent=labels[page];document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.p===page));teamPage()}else originalRender()};
render();
</script>
<script>
/* First-class agent records, independent of whether a SIM is assigned yet. */
d.agents??=[];
d.sims.filter(s=>s.agent).forEach(s=>{if(!d.agents.some(a=>a.name===s.agent))d.agents.push({id:'a'+s.id,name:s.agent,employeeId:s.agentId||'',phone:'',team:s.team,status:'active',createdAt:s.createdAt||now(),history:[{at:s.assignedAt||now(),from:'',to:s.team,by:'System migration',note:'Agent created from existing SIM assignment.'}]})});save();
function roster(){return role.value==='team_leader'?d.agents.filter(a=>a.team==='Field Sales Nairobi'):d.agents}
function agents(){let z=roster();app.innerHTML=`<div class="head"><div><h1>Agents</h1><p>Each agent has a permanent profile, team membership, SIM cards, and transfer history.</p></div>${write()?'<button class="primary" onclick="newAgent()">+ Add agent</button>':''}</div><div class="card tablewrap"><table><thead><tr><th>AGENT</th><th>STATUS</th><th>CURRENT TEAM</th><th>ACTIVE SIMS</th><th>SIM CARDS</th><th></th></tr></thead><tbody>${z.map(a=>{let cards=d.sims.filter(s=>s.agent===a.name);return `<tr><td><b>${e(a.name)}</b><br><span class="muted">${e(a.employeeId||'No ID')} · ${e(a.phone||'No contact')}</span></td><td>${badge(a.status==='active'?'in-use':a.status)}</td><td>${e(a.team)}</td><td>${cards.filter(s=>s.status==='in-use').length}</td><td>${cards.length?cards.map(s=>`<span class="click" onclick="profile('${s.id}')">${e(s.number)}</span>`).join(', '):'<span class="muted">No SIMs</span>'}</td><td>${write()?`<button class="secondary" onclick="transferAgent('${a.id}')">Transfer</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="6" class="empty">No agents in this team yet. Add an agent, then assign one or more SIM cards.</td></tr>'}</tbody></table></div>`}
function newAgent(){open(`<div class="dhead"><h2>Add agent</h2>${x()}</div><form class="form" onsubmit="createAgent(event)"><div><label>FULL NAME *</label><input name="name" required></div><div><label>EMPLOYEE / AGENT ID *</label><input name="employeeId" required></div><div><label>PHONE / CONTACT</label><input name="phone"></div><div><label>TEAM *</label><select name="team">${d.teams.filter(t=>t.active).map(t=>`<option value="${e(t.name)}">${e(t.name)} · ${e(t.leader)}</option>`).join('')}</select></div><div><label>EMPLOYMENT STATUS</label><select name="status"><option value="active">Active</option><option value="suspended">Suspended</option></select></div><div class="wide"><label>NOTES</label><textarea name="note"></textarea></div><div class="wide actions"><button type="button" class="secondary" onclick="close()">Cancel</button><button class="primary">Create agent</button></div></form>`)}
function createAgent(ev){ev.preventDefault();let f=Object.fromEntries(new FormData(ev.target));if(d.agents.some(a=>a.employeeId.toLowerCase()===f.employeeId.toLowerCase())){alert('An agent with this Employee / Agent ID already exists.');return}let a={id:'a'+Date.now(),...f,createdAt:now(),history:[{at:now(),from:'',to:f.team,by:'Alex Otieno',note:f.note||'Agent added to team.'}]};d.agents.push(a);audit('Agent created',a.name,`Added to ${a.team}`);save();close();go('agents')}
function transferAgent(id){let a=d.agents.find(x=>x.id===id)||d.agents.find(x=>x.name===id);if(!a)return;open(`<div class="dhead"><h2>Transfer ${e(a.name)}</h2>${x()}</div><form class="form" onsubmit="saveTransfer(event,'${a.id}')"><div><label>CURRENT TEAM</label><input disabled value="${e(a.team)}"></div><div><label>NEW TEAM *</label><select name="team">${d.teams.filter(t=>t.active&&t.name!==a.team).map(t=>`<option value="${e(t.name)}">${e(t.name)} · ${e(t.leader)}</option>`).join('')}</select></div><div class="wide"><label>REASON / NOTES *</label><textarea name="note" required></textarea></div><div class="wide actions"><button type="button" class="secondary" onclick="close()">Cancel</button><button class="primary">Transfer agent</button></div></form>`)}
function saveTransfer(ev,id){ev.preventDefault();let f=Object.fromEntries(new FormData(ev.target)),a=d.agents.find(x=>x.id===id),old=a.team,team=d.teams.find(t=>t.name===f.team);a.team=f.team;a.history.unshift({at:now(),from:old,to:f.team,by:'Alex Otieno',note:f.note});d.sims.filter(s=>s.agent===a.name).forEach(s=>{s.team=f.team;s.history.unshift({at:now(),action:`Agent transferred ${old} → ${f.team}`,by:'Alex Otieno',note:f.note})});d.agentHistory.unshift({at:now(),agent:a.name,agentId:a.employeeId,from:old,to:f.team,leader:team?.leader||'',note:f.note});audit('Agent transferred',a.name,`${old} to ${f.team}`);save();close();go('teams')}
function assign(ev,id){ev.preventDefault();let f=Object.fromEntries(new FormData(ev.target)),s=d.sims.find(x=>x.id===id),old=s.agent,prev=s.status,agent=d.agents.find(a=>a.name.toLowerCase()===f.agent.toLowerCase());if(!agent){alert('Create the agent first from the Agents page, then assign this SIM.');return}s.agent=agent.name;s.agentId=agent.employeeId;s.team=agent.team;s.assignedAt=new Date(f.at).toISOString();s.status='in-use';s.history.unshift({at:s.assignedAt,action:`${old?'Reassigned from '+old+' to':'Assigned to'} ${agent.name}${prev!=='in-use'?' · '+prev+' → In Use':''}`,by:'Alex Otieno',note:f.note});audit('SIM assignment',s.number,`Assigned to ${agent.name}`);save();profile(id)}
const oldRender2=render;render=function(){if(page==='agents'){crumb.textContent='Agents';document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.p===page));agents()}else oldRender2()};render();
</script>
<script>
/* Assignment now uses the managed agent roster; a SIM cannot be attached to an unknown agent. */
function assignFor(id){let s=d.sims.find(x=>x.id===id),pool=roster();open(`<div class="dhead"><h2>${s.agent?'Reassign':'Assign'} ${e(s.number)}</h2>${x()}</div><form class="form" onsubmit="assign(event,'${id}')"><div class="wide"><label>AGENT *</label><select name="agent" required>${pool.map(a=>`<option value="${e(a.name)}" ${a.name===s.agent?'selected':''}>${e(a.name)} · ${e(a.employeeId)} · ${e(a.team)}</option>`).join('')}</select><div class="muted" style="margin-top:5px">Only agents created in the Agents module can receive a SIM.</div></div><div><label>ASSIGNMENT DATE</label><input type="datetime-local" name="at" value="${now().slice(0,16)}"></div><div class="wide"><label>REASON *</label><textarea name="note" required></textarea></div><div class="wide actions"><button type="button" class="secondary" onclick="profile('${id}')">Cancel</button><button class="primary">Confirm assignment</button></div></form>`)}
function teamPage(){let cards=d.teams.map(t=>{let members=d.agents.filter(a=>a.team===t.name),sims=d.sims.filter(s=>s.team===t.name);return `<div class="card" style="margin-top:0"><div style="display:flex;justify-content:space-between"><div><h2>${e(t.name)}</h2><div class="muted">Team leader: ${e(t.leader)}</div></div>${t.active?'<span class="badge in-use">Active</span>':'<span class="badge suspended">Inactive</span>'}</div><div class="grid" style="grid-template-columns:repeat(2,1fr);margin-top:20px"><div><div class="label">AGENTS</div><div class="num">${members.length}</div></div><div><div class="label">SIM CARDS</div><div class="num">${sims.length}</div></div></div><div class="muted" style="margin-top:13px">${members.length?members.map(a=>e(a.name)).join(', '):'No agents currently assigned.'}</div></div>`}).join('');app.innerHTML=`<div class="head"><div><h1>Teams</h1><p>Every team has a leader, independent agent roster, and SIM-card inventory.</p></div>${write()?'<button class="primary" onclick="newTeam()">+ Add team</button>':''}</div><div class="grid" style="grid-template-columns:repeat(3,1fr)">${cards}</div><div class="card"><h2>Agent transfer history</h2><div class="tablewrap"><table><thead><tr><th>DATE / TIME</th><th>AGENT</th><th>FROM TEAM</th><th>TO TEAM</th><th>TEAM LEADER</th><th>REASON</th></tr></thead><tbody>${d.agentHistory.map(h=>`<tr><td>${dt(h.at)}</td><td><b>${e(h.agent)}</b><br><span class="muted">${e(h.agentId||'')}</span></td><td>${e(h.from)}</td><td>${e(h.to)}</td><td>${e(h.leader)}</td><td>${e(h.note)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No agent transfers recorded.</td></tr>'}</tbody></table></div></div>`}
</script>
<script>
/* Agent-first SIM workflow: add a phone number directly to the selected agent. */
function agents(){let z=roster();app.innerHTML=`<div class="head"><div><h1>Agents</h1><p>Add agents, then add one or more phone numbers to each agent.</p></div>${write()?'<button class="primary" onclick="newAgent()">+ Add agent</button>':''}</div><div class="card tablewrap"><table><thead><tr><th>AGENT</th><th>CURRENT TEAM</th><th>PHONE NUMBERS &amp; SIM STATUS</th><th></th></tr></thead><tbody>${z.map(a=>{let cards=d.sims.filter(s=>s.agent===a.name);return `<tr><td><b>${e(a.name)}</b><br><span class="muted">${e(a.employeeId||'No ID')} · ${e(a.phone||'No contact')}</span></td><td>${e(a.team)}</td><td>${cards.length?cards.map(s=>`<div style="margin:2px 0"><span class="click" onclick="profile('${s.id}')">${e(s.number)}</span> ${badge(s.status)}</div>`).join(''):'<span class="muted">No phone numbers added</span>'}</td><td>${write()?`<button class="secondary" onclick="addNumberFor('${a.id}')">+ Add number</button><button class="secondary" style="margin-left:5px" onclick="transferAgent('${a.id}')">Transfer</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="4" class="empty">No agents in this team yet. Add an agent to start recording phone numbers.</td></tr>'}</tbody></table></div>`}
function addNumberFor(agentId){let a=d.agents.find(x=>x.id===agentId);open(`<div class="dhead"><div><h2>Add phone number</h2><div class="muted">Assigning directly to ${e(a.name)} · ${e(a.team)}</div></div>${x()}</div><form class="form" onsubmit="createAgentNumber(event,'${agentId}')"><div><label>PHONE / SIM NUMBER *</label><input name="number" required placeholder="0712 345 678"></div><div><label>ICCID *</label><input name="iccid" required></div><div><label>NETWORK *</label><input name="network" required placeholder="Safaricom"></div><div><label>SIM TYPE</label><input name="type" value="Prepaid"></div><div><label>CURRENT STATUS *</label><select name="status"><option value="in-use">In Use</option><option value="blocked">Blocked</option><option value="disposed">Disposed</option><option value="suspended">Suspended</option><option value="pending-activation">Pending Activation</option></select></div><div><label>DATE ASSIGNED</label><input type="datetime-local" name="at" value="${now().slice(0,16)}"></div><div class="wide"><label>NOTES</label><textarea name="note"></textarea></div><div class="wide actions"><button type="button" class="secondary" onclick="close()">Cancel</button><button class="primary">Add number to agent</button></div></form>`)}
function createAgentNumber(ev,agentId){ev.preventDefault();let f=Object.fromEntries(new FormData(ev.target)),a=d.agents.find(x=>x.id===agentId),clean=f.number.replace(/\s/g,'');if(d.sims.some(s=>s.number.replace(/\s/g,'')===clean||s.iccid===f.iccid)){alert('This phone number or ICCID already exists.');return}let at=new Date(f.at).toISOString(),s={id:'s'+Date.now(),number:f.number,msisdn:clean,iccid:f.iccid,network:f.network,type:f.type,status:f.status,agent:a.name,agentId:a.employeeId,team:a.team,assignedAt:at,createdAt:at,balance:0,history:[{at,action:`Added and assigned to ${a.name} · Status set to ${f.status.replaceAll('-',' ')}`,by:'Alex Otieno',note:f.note||'Phone number added from agent profile.'}]};d.sims.unshift(s);audit('Phone number added',s.number,`Assigned to ${a.name} in ${a.team}`);save();close();go('agents')}
const oldRender3=render;render=function(){if(page==='agents'){crumb.textContent='Agents';document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.p===page));agents()}else oldRender3()};render();
</script>
<script>
/* Team-filtered agent roster, direct number-status updates, and agent-record exports. */
function agents(){app.innerHTML=`<div class="head"><div><h1>Agents</h1><p>Filter agents by team, manage each assigned number, and download records.</p></div>${write()?'<button class="primary" onclick="newAgent()">+ Add agent</button>':''}</div><div class="card"><div class="toolbar"><select id="agentTeamFilter" class="field" onchange="agentList()"><option value="">All teams</option>${d.teams.filter(t=>t.active).map(t=>`<option value="${e(t.name)}">${e(t.name)}</option>`).join('')}</select><button class="secondary" onclick="agentCSV()">⇩ Download records CSV</button></div><div class="tablewrap"><table><thead><tr><th>AGENT</th><th>CURRENT TEAM</th><th>PHONE NUMBERS &amp; STATUS</th><th></th></tr></thead><tbody id="agentRows"></tbody></table></div></div>`;agentList()}
function agentList(){let filter=document.getElementById('agentTeamFilter')?.value||'',z=roster().filter(a=>!filter||a.team===filter);agentRows.innerHTML=z.map(a=>{let cards=d.sims.filter(s=>s.agent===a.name);return `<tr><td><b>${e(a.name)}</b><br><span class="muted">${e(a.employeeId||'No ID')} · ${e(a.phone||'No contact')}</span></td><td><b>${e(a.team)}</b><br><span class="muted">${e(d.teams.find(t=>t.name===a.team)?.leader||'No team leader')}</span></td><td>${cards.length?cards.map(s=>`<div style="margin:4px 0;display:flex;gap:6px;align-items:center"><span class="click" onclick="profile('${s.id}')">${e(s.number)}</span>${badge(s.status)}${write()?`<button class="secondary" style="padding:4px 7px;font-size:10px" onclick="statusFor('${s.id}')">Update status</button>`:''}</div>`).join(''):'<span class="muted">No phone numbers added</span>'}</td><td>${write()?`<button class="secondary" onclick="addNumberFor('${a.id}')">+ Add number</button><button class="secondary" style="margin-left:5px" onclick="transferAgent('${a.id}')">Transfer</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="4" class="empty">No agents found for this team.</td></tr>'}
function agentCSV(){let team=document.getElementById('agentTeamFilter')?.value||'',agentIds=new Set(d.agents.filter(a=>!team||a.team===team).map(a=>a.name)),cols=['agent_name','agent_id','current_team','team_leader','phone_number','sim_status','network','iccid','date_assigned'];let data=d.sims.filter(s=>agentIds.has(s.agent)).map(s=>[s.agent,s.agentId,s.team,d.teams.find(t=>t.name===s.team)?.leader||'',s.number,s.status,s.network,s.iccid,s.assignedAt]);let out=[cols.join(','),...data.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(','))].join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'text/csv'}));a.download=`agent-sim-records${team?'-'+team.replaceAll(' ','-'):''}.csv`;a.click();audit('Report generated',team||'All teams','Agent and SIM records CSV export')}
const oldRender4=render;render=function(){if(page==='agents'){crumb.textContent='Agents';document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.p===page));agents()}else oldRender4()};render();
</script>
<script>

d.users??=[{id:'u-admin',username:'karu',fullName:'Karu',role:'admin',password:'ChangeMe!2026',active:true,createdAt:now()}];save();

role.style.display='none';

function loginScreen(message=''){let old=document.getElementById('loginScreen');if(old)old.remove();let box=document.createElement('div');box.id='loginScreen';box.style.cssText='position:fixed;z-index:50;inset:0;background:#101b35;display:grid;place-items:center;padding:20px';box.innerHTML=`<div style="background:#fff;border-radius:13px;width:min(390px,100%);padding:30px"><h1 style="margin:0;color:#17213a">SIMHQ</h1><p style="color:#71809a;margin:6px 0 22px">Sign in to manage your organization’s SIM records.</p>${message?`<div style="background:#fff0f0;color:#bd4b4c;padding:9px;border-radius:6px;font-size:12px;margin-bottom:12px">${e(message)}</div>`:''}<form onsubmit="login(event)"><label style="font-size:11px;font-weight:800">USERNAME</label><input name="username" required style="width:100%;margin:5px 0 13px;padding:10px;border:1px solid #dbe2ed;border-radius:7px"><label style="font-size:11px;font-weight:800">PASSWORD</label><input name="password" type="password" required style="width:100%;margin:5px 0 18px;padding:10px;border:1px solid #dbe2ed;border-radius:7px"><button class="primary" style="width:100%">Log in</button></form><p style="font-size:11px;color:#71809a;margin:18px 0 0">Initial administrator: <b>karu</b> · Password: <b>ChangeMe!2026</b></p></div>`;document.body.append(box)}
function login(ev){ev.preventDefault();let f=Object.fromEntries(new FormData(ev.target)),u=d.users.find(x=>x.active&&x.username.toLowerCase()===f.username.toLowerCase()&&x.password===f.password);if(!u){loginScreen('Incorrect username or password.');return}session={id:u.id,username:u.username,role:u.role};localStorage.setItem(K+'-session',JSON.stringify(session));role.value=u.role;document.getElementById('loginScreen').remove();logoutButton.style.display='block';render()}

function newUser(){open(`<div class="dhead"><h2>Create user / Team Leader</h2>${x()}</div><form class="form" onsubmit="createUser(event)"><div><label>FULL NAME *</label><input name="fullName" required></div><div><label>USERNAME *</label><input name="username" required></div><div><label>ROLE *</label><select name="role"><option value="team_leader">Team Leader</option><option value="supervisor">Supervisor</option><option value="agent">Agent</option><option value="admin">Admin</option></select></div><div><label>TEMPORARY PASSWORD *</label><input name="password" type="password" required minlength="8"></div><div class="wide"><label>OPTIONAL TEAM NAME</label><input name="team" placeholder="Create a team later, or assign this user as a leader"></div><div class="wide actions"><button type="button" class="secondary" onclick="close()">Cancel</button><button class="primary">Create user</button></div></form>`)}
function createUser(ev){ev.preventDefault();let f=Object.fromEntries(new FormData(ev.target));if(d.users.some(u=>u.username.toLowerCase()===f.username.toLowerCase())){alert('This username is already in use.');return}let u={id:'u'+Date.now(),...f,active:true,createdAt:now()};d.users.push(u);audit('User created',u.username,`Created ${u.role.replaceAll('_',' ')} account`);save();close();go('users')}
function resetRecords(){if(!confirm('Delete all teams, agents, SIM cards, usage and audit history? This cannot be undone.'))return;d.sims=[];d.teams=[];d.agents=[];d.usage=[];d.audit=[];d.agentHistory=[];save();go('dashboard')}
function newTeam(){let leaders=d.users.filter(u=>u.role==='team_leader'&&u.active);open(`<div class="dhead"><h2>Add team</h2>${x()}</div><form class="form" onsubmit="createTeam(event)"><div><label>TEAM NAME *</label><input name="name" required></div><div><label>TEAM LEADER *</label><select name="leader">${leaders.map(u=>`<option value="${e(u.fullName)}">${e(u.fullName)} · ${e(u.username)}</option>`).join('')||'<option value="">Create a Team Leader in Users first</option>'}</select></div><div class="wide actions"><button type="button" class="secondary" onclick="close()">Cancel</button><button class="primary">Create team</button></div></form>`)}
const oldRender5=render;render=function(){if(page==='users'){crumb.textContent='Users & access';document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.p===page));users()}else oldRender5()};
if(session){let u=d.users.find(x=>x.id===session.id&&x.active);if(u){role.value=u.role;logoutButton.style.display='block';render()}else logout()}else{logoutButton.style.display='none';loginScreen()}

<script>
/* Role-specific navigation: Team Leaders only operate teams, agents, and weekly reports. */
function signedInName(){return d.users.find(u=>u.id===session?.id)?.fullName||session?.username||'Signed-in user'}
function applyRoleNavigation(){let allowed=session?.role==='team_leader'?['teams','agents','usage']:null;document.querySelectorAll('.nav').forEach(n=>n.style.display=allowed&&!allowed.includes(n.dataset.p)?'none':'');document.querySelector('.user').innerHTML=`<b>${e(session?signedInName():'Not signed in')}</b><br>${e(session?(session.role==='team_leader'?'Team Leader':session.role.replaceAll('_',' ')):'')}`;if(allowed&&!allowed.includes(page))page='agents'}
function login(ev){ev.preventDefault();let f=Object.fromEntries(new FormData(ev.target)),u=d.users.find(x=>x.active&&x.username.toLowerCase()===f.username.toLowerCase()&&x.password===f.password);if(!u){loginScreen('Incorrect username or password.');return}session={id:u.id,username:u.username,role:u.role};localStorage.setItem(K+'-session',JSON.stringify(session));role.value=u.role;document.getElementById('loginScreen').remove();logoutButton.style.display='block';applyRoleNavigation();render()}
function logout(){localStorage.removeItem(K+'-session');session=null;logoutButton.style.display='none';applyRoleNavigation();loginScreen()}
const rawAuditPush=d.audit.unshift.bind(d.audit);d.audit.unshift=function(...items){items.forEach(item=>{if(item.by==='Alex Otieno')item.by=signedInName()});return rawAuditPush(...items)};
function removeLegacyName(root=document.body){let w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);for(let n=w.nextNode();n;n=w.nextNode())if(n.nodeValue.includes('Alex Otieno'))n.nodeValue=n.nodeValue.replaceAll('Alex Otieno',signedInName())}
new MutationObserver(changes=>changes.forEach(c=>c.addedNodes.forEach(n=>{if(n.nodeType===1)removeLegacyName(n)}))).observe(document.body,{childList:true,subtree:true});
/* Use explicit delegated controls so Cancel is not affected by window.close(). */
document.addEventListener('click',ev=>{let button=ev.target.closest('button');if(!button)return;let label=button.textContent.trim();if(label==='Cancel'||button.classList.contains('close')){ev.preventDefault();modal.classList.remove('show')}});
/* Searchable team and agent records, plus editable team leader assignment. */
function teamPage(){app.innerHTML=`<div class="head"><div><h1>Teams</h1><p>Search teams, update their leaders, and review agent and SIM-card inventory.</p></div>${write()?'<button class="primary" onclick="newTeam()">+ Add team</button>':''}</div><div class="toolbar"><input id="teamSearch" class="field search" placeholder="Search team or team leader" oninput="listTeams()"></div><div id="teamCards" class="grid" style="grid-template-columns:repeat(3,1fr)"></div><div class="card"><h2>Agent transfer history</h2><div class="tablewrap"><table><thead><tr><th>DATE / TIME</th><th>AGENT</th><th>FROM TEAM</th><th>TO TEAM</th><th>TEAM LEADER</th><th>REASON</th></tr></thead><tbody>${d.agentHistory.map(h=>`<tr><td>${dt(h.at)}</td><td><b>${e(h.agent)}</b><br><span class="muted">${e(h.agentId||'')}</span></td><td>${e(h.from)}</td><td>${e(h.to)}</td><td>${e(h.leader)}</td><td>${e(h.note)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No agent transfers recorded.</td></tr>'}</tbody></table></div></div>`;listTeams()}
function listTeams(){let q=(document.getElementById('teamSearch')?.value||'').toLowerCase(),teams=d.teams.filter(t=>(t.name+' '+t.leader).toLowerCase().includes(q));teamCards.innerHTML=teams.length?teams.map(t=>{let members=d.agents.filter(a=>a.team===t.name),sims=d.sims.filter(s=>s.team===t.name);return `<div class="card" style="margin-top:0"><div style="display:flex;justify-content:space-between;gap:8px"><div><h2>${e(t.name)}</h2><div class="muted">Team leader: ${e(t.leader)}</div></div>${write()?`<button class="secondary" onclick="editTeam('${t.id}')">Edit</button>`:''}</div><div class="grid" style="grid-template-columns:repeat(2,1fr);margin-top:20px"><div><div class="label">AGENTS</div><div class="num">${members.length}</div></div><div><div class="label">SIM CARDS</div><div class="num">${sims.length}</div></div></div><div class="muted" style="margin-top:13px">${members.length?members.map(a=>e(a.name)).join(', '):'No agents currently assigned.'}</div></div>`}).join(''):'<div class="card empty" style="margin-top:0;grid-column:1/-1">No teams match this search.</div>'}
function editTeam(id){let t=d.teams.find(x=>x.id===id),leaders=d.users.filter(u=>u.role==='team_leader'&&u.active);open(`<div class="dhead"><h2>Edit team</h2>${x()}</div><form class="form" onsubmit="updateTeam(event,'${id}')"><div><label>TEAM NAME *</label><input name="name" value="${e(t.name)}" required></div><div><label>TEAM LEADER *</label><select name="leader">${leaders.map(u=>`<option value="${e(u.fullName)}" ${u.fullName===t.leader?'selected':''}>${e(u.fullName)} · ${e(u.username)}</option>`).join('')||`<option value="${e(t.leader)}">${e(t.leader)}</option>`}</select></div><div class="wide"><label>STATUS</label><select name="active"><option value="true" ${t.active?'selected':''}>Active</option><option value="false" ${!t.active?'selected':''}>Inactive</option></select></div><div class="wide actions"><button type="button" class="secondary" onclick="modal.classList.remove('show')">Cancel</button><button class="primary">Save team changes</button></div></form>`)}
function updateTeam(ev,id){ev.preventDefault();let f=Object.fromEntries(new FormData(ev.target)),t=d.teams.find(x=>x.id===id),old=t.name;t.name=f.name;t.leader=f.leader;t.active=f.active==='true';if(old!==t.name){d.agents.filter(a=>a.team===old).forEach(a=>a.team=t.name);d.sims.filter(s=>s.team===old).forEach(s=>{s.team=t.name;s.history.unshift({at:now(),action:`Team renamed ${old} → ${t.name}`,by:signedInName(),note:'Team record updated.'})})}audit('Team updated',t.name,`Team leader: ${t.leader}`);save();modal.classList.remove('show');go('teams')}
function agents(){app.innerHTML=`<div class="head"><div><h1>Agents</h1><p>Search agents, filter by team, and manage each assigned number.</p></div>${write()?'<button class="primary" onclick="newAgent()">+ Add agent</button>':''}</div><div class="card"><div class="toolbar"><input id="agentSearch" class="field search" placeholder="Search agent, ID, team, or phone number" oninput="agentList()"><select id="agentTeamFilter" class="field" onchange="agentList()"><option value="">All teams</option>${d.teams.filter(t=>t.active).map(t=>`<option value="${e(t.name)}">${e(t.name)}</option>`).join('')}</select><button class="secondary" onclick="agentCSV()">⇩ Download records CSV</button></div><div class="tablewrap"><table><thead><tr><th>AGENT</th><th>CURRENT TEAM</th><th>PHONE NUMBERS &amp; STATUS</th><th></th></tr></thead><tbody id="agentRows"></tbody></table></div></div>`;agentList()}
function agentList(){let team=document.getElementById('agentTeamFilter')?.value||'',q=(document.getElementById('agentSearch')?.value||'').toLowerCase(),z=roster().filter(a=>(!team||a.team===team)&&[a.name,a.employeeId,a.phone,a.team,...d.sims.filter(s=>s.agent===a.name).map(s=>s.number)].join(' ').toLowerCase().includes(q));agentRows.innerHTML=z.map(a=>{let cards=d.sims.filter(s=>s.agent===a.name);return `<tr><td><b>${e(a.name)}</b><br><span class="muted">${e(a.employeeId||'No ID')} · ${e(a.phone||'No contact')}</span></td><td><b>${e(a.team)}</b><br><span class="muted">${e(d.teams.find(t=>t.name===a.team)?.leader||'No team leader')}</span></td><td>${cards.length?cards.map(s=>`<div style="margin:4px 0;display:flex;gap:6px;align-items:center"><span class="click" onclick="profile('${s.id}')">${e(s.number)}</span>${badge(s.status)}${write()?`<button class="secondary" style="padding:4px 7px;font-size:10px" onclick="statusFor('${s.id}')">Update status</button>`:''}</div>`).join(''):'<span class="muted">No phone numbers added</span>'}</td><td>${write()?`<button class="secondary" onclick="addNumberFor('${a.id}')">+ Add number</button><button class="secondary" style="margin-left:5px" onclick="transferAgent('${a.id}')">Transfer</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="4" class="empty">No agents match this search.</td></tr>'}
const oldRender6=render;render=function(){if(page==='teams'){crumb.textContent='Teams';document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.p===page));teamPage()}else if(page==='agents'){crumb.textContent='Agents';document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.p===page));agents()}else oldRender6()};
function purgeLegacyActor(){let replacement=session?.username||'System';d.sims.forEach(s=>s.history?.forEach(h=>{if(h.by==='Alex Otieno')h.by=replacement;if(typeof h.note==='string')h.note=h.note.replaceAll('Alex Otieno',replacement)}));d.audit.forEach(a=>{if(a.by==='Alex Otieno')a.by=replacement;if(typeof a.note==='string')a.note=a.note.replaceAll('Alex Otieno',replacement)});d.agentHistory.forEach(h=>{if(h.by==='Alex Otieno')h.by=replacement});save()}
purgeLegacyActor();

function list(){let input=document.getElementById('q'),filter=document.getElementById('sf'),target=document.getElementById('rows');if(!target)return;let query=(input?.value||'').trim().toLowerCase(),statusFilter=filter?.value||'';let matches=d.sims.filter(s=>{let fields=[s.number,s.msisdn,s.iccid,s.imsi,s.agent,s.agentId,s.team,s.network,s.status].filter(Boolean).join(' ').toLowerCase();return (!statusFilter||s.status===statusFilter)&&(!query||fields.includes(query))});target.innerHTML=matches.length?matches.map(s=>`<tr><td><span class="click" onclick="profile('${s.id}')">${e(s.number)}</span><br><span class="muted">${e(s.iccid||'No ICCID')}</span></td><td>${s.agent?`<b>${e(s.agent)}</b><br><span class="muted">${e(s.team)}</span>`:'<span class="muted">Unassigned · Inventory</span>'}</td><td>${e(s.network)}</td><td>${badge(s.status)}</td><td>${s.assignedAt?dt(s.assignedAt):'—'}</td><td>${s.history?.[0]?dt(s.history[0].at):'—'}</td><td><button class="secondary" onclick="profile('${s.id}')">Open</button></td></tr>`).join(''):`<tr><td colspan="7" class="empty">No results found${query?` for “${e(query)}”`:''}. Try a SIM number, phone number, agent name, team, or network.</td></tr>`}
if(session)render();
/* Explicit no-results banner for SIM inventory search. */
function list(){let input=document.getElementById('q'),filter=document.getElementById('sf'),target=document.getElementById('rows');if(!target)return;let query=(input?.value||'').trim().toLowerCase(),statusFilter=filter?.value||'';let matches=d.sims.filter(s=>{let fields=[s.number,s.msisdn,s.iccid,s.imsi,s.agent,s.agentId,s.team,s.network,s.status].filter(Boolean).join(' ').toLowerCase();return (!statusFilter||s.status===statusFilter)&&(!query||fields.includes(query))});let card=target.closest('.card'),notice=document.getElementById('simNoResults');if(!notice){notice=document.createElement('div');notice.id='simNoResults';notice.setAttribute('role','status');notice.style.cssText='display:none;margin:0 0 14px;padding:12px 14px;border:1px solid #f0d69f;background:#fff8e8;color:#75500a;border-radius:7px;font-weight:650';card.querySelector('.tablewrap').before(notice)}notice.style.display=matches.length?'none':'block';notice.textContent=matches.length?'':`No results found${query?` for “${input.value.trim()}”`:''}. Try another SIM number, phone number, agent name, team, or network.`;target.innerHTML=matches.map(s=>`<tr><td><span class="click" onclick="profile('${s.id}')">${e(s.number)}</span><br><span class="muted">${e(s.iccid||'No ICCID')}</span></td><td>${s.agent?`<b>${e(s.agent)}</b><br><span class="muted">${e(s.team)}</span>`:'<span class="muted">Unassigned · Inventory</span>'}</td><td>${e(s.network)}</td><td>${badge(s.status)}</td><td>${s.assignedAt?dt(s.assignedAt):'—'}</td><td>${s.history?.[0]?dt(s.history[0].at):'—'}</td><td><button class="secondary" onclick="profile('${s.id}')">Open</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No matching SIM records.</td></tr>'}
function sims(){app.innerHTML=`<div class="head"><div><h1>SIM cards</h1><p>Search, assign, update status, and retain full history.</p></div>${write()?'<button class="primary" onclick="newSim()">+ Add SIM card</button>':''}</div><div class="card"><div class="toolbar"><input id="q" class="field search" placeholder="Search SIM, phone number, agent, team, or network" oninput="list()"><button class="primary" onclick="list()">Search</button><select id="sf" class="field" onchange="list()"><option value="">All statuses</option><option>available</option><option>in-use</option><option>blocked</option><option>lost</option><option>suspended</option></select><button class="secondary" onclick="csv()">⇩ CSV</button></div><div class="tablewrap"><table><thead><tr><th>SIM NUMBER</th><th>AGENT / TEAM</th><th>NETWORK</th><th>STATUS</th><th>ASSIGNED</th><th>LAST EVENT</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div>`;list()}
const oldRender7=render;render=function(){if(page==='sims'){crumb.textContent='SIM Cards';document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.p===page));sims()}else oldRender7()};if(session)render();
d.damageReports??=[];save();
function agents(){app.innerHTML=`<div class="head"><div><h1>Agents</h1><p>Search agents, manage phone numbers, and record equipment damage.</p></div>${write()?'<button class="primary" onclick="newAgent()">+ Add agent</button>':''}</div><div class="card"><div class="toolbar"><input id="agentSearch" class="field search" placeholder="Search agent, ID, team, or phone number" oninput="agentList()"><select id="agentTeamFilter" class="field" onchange="agentList()"><option value="">All teams</option>${d.teams.filter(t=>t.active).map(t=>`<option value="${e(t.name)}">${e(t.name)}</option>`).join('')}</select><button class="secondary" onclick="agentCSV()">⇩ Download records CSV</button></div><div class="tablewrap"><table><thead><tr><th>AGENT</th><th>CURRENT TEAM</th><th>PHONE NUMBERS &amp; STATUS</th><th>EQUIPMENT DAMAGE</th><th></th></tr></thead><tbody id="agentRows"></tbody></table></div></div>`;agentList()}
function agentList(){let team=document.getElementById('agentTeamFilter')?.value||'',q=(document.getElementById('agentSearch')?.value||'').toLowerCase(),z=roster().filter(a=>(!team||a.team===team)&&[a.name,a.employeeId,a.phone,a.team,...d.sims.filter(s=>s.agent===a.name).map(s=>s.number)].join(' ').toLowerCase().includes(q));agentRows.innerHTML=z.map(a=>{let cards=d.sims.filter(s=>s.agent===a.name),damages=d.damageReports.filter(r=>r.agentId===a.id);return `<tr><td><b>${e(a.name)}</b><br><span class="muted">${e(a.employeeId||'No ID')} · ${e(a.phone||'No contact')}</span></td><td><b>${e(a.team)}</b><br><span class="muted">${e(d.teams.find(t=>t.name===a.team)?.leader||'No team leader')}</span></td><td>${cards.length?cards.map(s=>`<div style="margin:4px 0;display:flex;gap:6px;align-items:center"><span class="click" onclick="profile('${s.id}')">${e(s.number)}</span>${badge(s.status)}${write()?`<button class="secondary" style="padding:4px 7px;font-size:10px" onclick="statusFor('${s.id}')">Update status</button>`:''}</div>`).join(''):'<span class="muted">No phone numbers added</span>'}</td><td>${damages.length?`<span class="badge blocked">${damages.length} report${damages.length>1?'s':''}</span><br><button class="secondary" style="margin-top:6px;padding:4px 7px;font-size:10px" onclick="viewDamage('${a.id}')">View history</button>`:'<span class="muted">No reports</span>'}</td><td>${write()?`<button class="secondary" onclick="addNumberFor('${a.id}')">+ Add number</button><button class="secondary" style="margin:5px 0 0" onclick="newDamage('${a.id}')">Report damage</button><button class="secondary" style="margin:5px 0 0" onclick="transferAgent('${a.id}')">Transfer</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="5" class="empty">No agents match this search.</td></tr>'}
function newDamage(agentId){let a=d.agents.find(x=>x.id===agentId);open(`<div class="dhead"><div><h2>Report equipment damage</h2><div class="muted">Agent: ${e(a.name)} · ${e(a.team)}</div></div>${x()}</div><form class="form" onsubmit="saveDamage(event,'${agentId}')"><div><label>EQUIPMENT TYPE *</label><select name="item"><option>Headphones</option><option>Mouse</option><option>Laptop</option><option>Keyboard</option><option>Other</option></select></div><div><label>DATE OF DAMAGE *</label><input type="date" name="damagedOn" required value="${now().slice(0,10)}"></div><div><label>REPORT DATE</label><input type="date" name="reportedOn" value="${now().slice(0,10)}"></div><div><label>CONDITION</label><select name="condition"><option>Damaged</option><option>Lost</option><option>Needs repair</option><option>Replaced</option></select></div><div class="wide"><label>DESCRIPTION / NOTES *</label><textarea name="note" required placeholder="Describe the issue, serial number, or action taken"></textarea></div><div class="wide actions"><button type="button" class="secondary" onclick="modal.classList.remove('show')">Cancel</button><button class="primary">Save damage report</button></div></form>`)}
function saveDamage(ev,agentId){ev.preventDefault();let f=Object.fromEntries(new FormData(ev.target)),a=d.agents.find(x=>x.id===agentId),report={id:'dr'+Date.now(),agentId,agent:a.name,team:a.team,...f,createdAt:now(),reportedBy:signedInName()};d.damageReports.unshift(report);audit('Equipment damage reported',a.name,`${f.item} · ${f.condition} · damaged ${f.damagedOn}`);save();modal.classList.remove('show');go('agents')}
function viewDamage(agentId){let a=d.agents.find(x=>x.id===agentId),reports=d.damageReports.filter(r=>r.agentId===agentId);open(`<div class="dhead"><div><h2>Equipment damage history</h2><div class="muted">${e(a.name)} · ${e(a.team)}</div></div>${x()}</div><div class="tablewrap" style="padding:20px"><table><thead><tr><th>ITEM</th><th>CONDITION</th><th>DAMAGED DATE</th><th>REPORTED DATE</th><th>NOTES</th></tr></thead><tbody>${reports.map(r=>`<tr><td><b>${e(r.item)}</b></td><td>${e(r.condition)}</td><td>${e(r.damagedOn)}</td><td>${e(r.reportedOn)}</td><td>${e(r.note)}</td></tr>`).join('')}</tbody></table></div>`)}
const oldRender8=render;render=function(){if(page==='agents'){crumb.textContent='Agents';document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.p===page));agents()}else oldRender8()};if(session)render();
function leaderTeam(){return d.teams.find(t=>t.leader===signedInName())?.name||''}
function usage(){let team=role.value==='team_leader'?leaderTeam():'',agents=(team?d.agents.filter(a=>a.team===team):d.agents),records=team?d.usage.filter(u=>u.team===team):d.usage;app.innerHTML=`<div class="head"><div><h1>Weekly usage</h1><p>${team?`Weekly report for ${e(team)}. Only your team’s agents are shown.`:'Weekly SIM usage records for all teams.'}</p></div>${write()&&!team?'<button class="primary" onclick="usageFor()">+ Record weekly usage</button>':''}</div><div class="card"><h2>${team?e(team)+' agents':'Agents by team'}</h2><div class="tablewrap"><table><thead><tr><th>AGENT</th><th>TEAM</th><th>ASSIGNED PHONE NUMBERS</th><th>WEEKLY UPDATE</th></tr></thead><tbody>${agents.map(a=>{let sims=d.sims.filter(s=>s.agent===a.name);return `<tr><td><b>${e(a.name)}</b><br><span class="muted">${e(a.employeeId||'No ID')}</span></td><td>${e(a.team)}</td><td>${sims.length?sims.map(s=>`${e(s.number)} ${badge(s.status)}`).join('<br>'):'<span class="muted">No SIM numbers assigned</span>'}</td><td>${sims.length&&write()?`<button class="primary" onclick="weeklyForAgent('${a.id}')">Update weekly usage</button>`:'<span class="muted">Assign a number first</span>'}</td></tr>`}).join('')||'<tr><td colspan="4" class="empty">No agents in this team yet.</td></tr>'}</tbody></table></div></div><div class="card tablewrap"><h2>Submitted weekly records</h2><table><thead><tr><th>WEEK</th><th>SIM / AGENT</th><th>TEAM</th><th>AIRTIME</th><th>DATA MB</th><th>TOTAL SPEND</th><th>BY</th></tr></thead><tbody>${records.map(u=>`<tr><td>${e(u.week)}</td><td><b>${e(u.number)}</b><br><span class="muted">${e(u.agent)}</span></td><td>${e(u.team)}</td><td>KES ${e(u.airtime)}</td><td>${e(u.data)}</td><td>KES ${e(u.total)}</td><td>${e(u.by)}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">No weekly records submitted yet.</td></tr>'}</tbody></table></div>`}
function weeklyForAgent(agentId){let a=d.agents.find(x=>x.id===agentId),sims=d.sims.filter(s=>s.agent===a.name);open(`<div class="dhead"><div><h2>Update weekly usage</h2><div class="muted">${e(a.name)} · ${e(a.team)}</div></div>${x()}</div><form class="form" onsubmit="addUsage(event)"><div><label>PHONE NUMBER *</label><select name="sim">${sims.map(s=>`<option value="${s.id}">${e(s.number)} · ${e(s.status)}</option>`).join('')}</select></div><div><label>WEEK STARTING *</label><input type="date" name="week" required></div><div><label>AIRTIME PURCHASED (KES)</label><input name="airtime" type="number" min="0" value="0"></div><div><label>SMS BUNDLE PURCHASED (KES)</label><input name="sms" type="number" min="0" value="0"></div><div><label>CALLING MINUTES PURCHASED (KES)</label><input name="calls" type="number" min="0" value="0"></div><div><label>DATA BUNDLE PURCHASED (KES)</label><input name="bundle" type="number" min="0" value="0"></div><div><label>DATA USED (MB)</label><input name="data" type="number" min="0" value="0"></div><div><label>SMS USED</label><input name="smsUsed" type="number" min="0" value="0"></div><div class="wide"><label>NOTES</label><textarea name="note"></textarea></div><div class="wide actions"><button type="button" class="secondary" onclick="modal.classList.remove('show')">Cancel</button><button class="primary">Save weekly update</button></div></form>`)}
const oldRender9=render;render=function(){if(page==='usage'){crumb.textContent='Weekly Usage';document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.p===page));usage()}else oldRender9()};if(session)render();
/* Soft-delete agents without destroying SIM-card history. */
function roster(){let active=d.agents.filter(a=>a.status!=='left_organization');return role.value==='team_leader'?active.filter(a=>a.team===leaderTeam()):active}
function deactivateAgent(agentId){let a=d.agents.find(x=>x.id===agentId);if(!a||!confirm(`Deactivate ${a.name}? Their SIM, usage, and transfer history will be retained.`))return;a.status='left_organization';a.deactivatedAt=now();a.history??=[];a.history.unshift({at:now(),from:a.team,to:'',by:signedInName(),note:'Agent deactivated.'});d.sims.filter(s=>s.agent===a.name).forEach(s=>s.history.unshift({at:now(),action:'Agent deactivated',by:signedInName(),note:'Agent removed from active roster; SIM record retained.'}));audit('Agent deactivated',a.name,'Soft-deleted; historical records retained');save();go('agents')}
function addDeactivateButtons(){if(!write())return;document.querySelectorAll('#agentRows tr').forEach(row=>{let name=row.querySelector('td b')?.textContent,agent=d.agents.find(a=>a.name===name);if(!agent||row.querySelector('.deactivate-agent'))return;let cell=row.querySelector('td:last-child'),button=document.createElement('button');button.className='secondary deactivate-agent';button.style.cssText='margin:5px 0 0;color:#bd4b4c';button.textContent='Delete agent';button.onclick=()=>deactivateAgent(agent.id);cell.append(button)})}
const baseAgentList=agentList;agentList=function(){baseAgentList();addDeactivateButtons()};if(session&&page==='agents')agents();
/* Admin user-login management. Deleting a user deactivates the account to retain audit history. */
function users(){let admin=session?.role==='admin';app.innerHTML=`<div class="head"><div><h1>Users &amp; access</h1><p>Create, edit, deactivate, and reset user login details.</p></div>${admin?'<button class="primary" onclick="newUser()">+ Create user</button>':''}</div><div class="card tablewrap"><table><thead><tr><th>FULL NAME</th><th>USERNAME</th><th>ROLE</th><th>STATUS</th><th>CREATED</th><th></th></tr></thead><tbody>${d.users.map(u=>`<tr><td><b>${e(u.fullName)}</b></td><td>${e(u.username)}</td><td>${e(u.role.replaceAll('_',' '))}</td><td>${u.active?'<span class="badge in-use">Active</span>':'<span class="badge suspended">Inactive</span>'}</td><td>${dt(u.createdAt)}</td><td>${admin?`<button class="secondary" onclick="editUser('${u.id}')">Edit login</button>${u.id!==session.id?`<button class="secondary" style="margin-left:5px;color:#bd4b4c" onclick="deleteUser('${u.id}')">Delete</button>`:''}`:''}</td></tr>`).join('')}</tbody></table></div>${admin?'<div class="card"><h2>Data administration</h2><p class="muted">Permanently removes all teams, agents, SIM cards, weekly usage, and audit records. User accounts are kept.</p><button class="secondary" onclick="resetRecords()">Delete all operational data</button></div>':''}`}
function editUser(id){let u=d.users.find(x=>x.id===id);open(`<div class="dhead"><h2>Edit user login</h2>${x()}</div><form class="form" onsubmit="saveUser(event,'${id}')"><div><label>FULL NAME *</label><input name="fullName" required value="${e(u.fullName)}"></div><div><label>USERNAME *</label><input name="username" required value="${e(u.username)}"></div><div><label>ROLE *</label><select name="role">${['admin','supervisor','team_leader','agent'].map(r=>`<option value="${r}" ${r===u.role?'selected':''}>${r.replaceAll('_',' ')}</option>`).join('')}</select></div><div><label>ACCOUNT STATUS</label><select name="active"><option value="true" ${u.active?'selected':''}>Active</option><option value="false" ${!u.active?'selected':''}>Inactive</option></select></div><div class="wide"><label>NEW PASSWORD</label><input name="password" type="password" minlength="8" placeholder="Leave blank to keep current password"><div class="muted" style="margin-top:5px">Enter a new password only when resetting or changing it.</div></div><div class="wide actions"><button type="button" class="secondary" onclick="modal.classList.remove('show')">Cancel</button><button class="primary">Save user changes</button></div></form>`)}
function saveUser(ev,id){ev.preventDefault();let f=Object.fromEntries(new FormData(ev.target)),u=d.users.find(x=>x.id===id);if(d.users.some(x=>x.id!==id&&x.username.toLowerCase()===f.username.toLowerCase())){alert('This username is already in use.');return}let oldUser=u.username,oldName=u.fullName;u.fullName=f.fullName;u.username=f.username;u.role=f.role;u.active=f.active==='true';d.teams.filter(t=>t.leader===oldName).forEach(t=>t.leader=u.fullName);if(f.password)u.password=f.password;audit('User login updated',u.username,`Updated account previously named ${oldUser}`);save();if(id===session.id){session={id:u.id,username:u.username,role:u.role};localStorage.setItem(K+'-session',JSON.stringify(session));role.value=u.role;applyRoleNavigation()}modal.classList.remove('show');go('users')}
function deleteUser(id){let u=d.users.find(x=>x.id===id);if(!u||!confirm(`Delete ${u.username}? Their account will be deactivated and audit history retained.`))return;u.active=false;u.deactivatedAt=now();audit('User deleted',u.username,'Account deactivated; history retained');save();go('users')}
const oldRender10=render;render=function(){if(page==='users'){crumb.textContent='Users & access';document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.p===page));users()}else oldRender10()};if(session)render();
/* Simplified agent and number forms: no Employee/Agent ID or ICCID required. */
function newAgent(){open(`<div class="dhead"><h2>Add agent</h2>${x()}</div><form class="form" onsubmit="createAgent(event)"><div><label>FULL NAME *</label><input name="name" required></div><div><label>PHONE / CONTACT</label><input name="phone"></div><div><label>TEAM *</label><select name="team">${d.teams.filter(t=>t.active).map(t=>`<option value="${e(t.name)}">${e(t.name)} · ${e(t.leader)}</option>`).join('')}</select></div><div><label>EMPLOYMENT STATUS</label><select name="status"><option value="active">Active</option><option value="suspended">Suspended</option></select></div><div class="wide"><label>NOTES</label><textarea name="note"></textarea></div><div class="wide actions"><button type="button" class="secondary" onclick="modal.classList.remove('show')">Cancel</button><button class="primary">Create agent</button></div></form>`)}
function createAgent(ev){ev.preventDefault();let f=Object.fromEntries(new FormData(ev.target));if(d.agents.some(a=>a.name.toLowerCase()===f.name.toLowerCase())){alert('An agent with this name already exists.');return}let a={id:'a'+Date.now(),...f,employeeId:'',createdAt:now(),history:[{at:now(),from:'',to:f.team,by:signedInName(),note:f.note||'Agent added to team.'}]};d.agents.push(a);audit('Agent created',a.name,`Added to ${a.team}`);save();modal.classList.remove('show');go('agents')}
function addNumberFor(agentId){let a=d.agents.find(x=>x.id===agentId);open(`<div class="dhead"><div><h2>Add phone number</h2><div class="muted">Assigning directly to ${e(a.name)} · ${e(a.team)}</div></div>${x()}</div><form class="form" onsubmit="createAgentNumber(event,'${agentId}')"><div><label>PHONE / SIM NUMBER *</label><input name="number" required placeholder="0712 345 678"></div><div><label>NETWORK *</label><input name="network" required placeholder="Safaricom"></div><div><label>SIM TYPE</label><input name="type" value="Prepaid"></div><div><label>CURRENT STATUS *</label><select name="status"><option value="in-use">In Use</option><option value="blocked">Blocked</option><option value="disposed">Disposed</option><option value="suspended">Suspended</option><option value="pending-activation">Pending Activation</option></select></div><div><label>DATE ASSIGNED</label><input type="datetime-local" name="at" value="${now().slice(0,16)}"></div><div class="wide"><label>NOTES</label><textarea name="note"></textarea></div><div class="wide actions"><button type="button" class="secondary" onclick="modal.classList.remove('show')">Cancel</button><button class="primary">Add number to agent</button></div></form>`)}
function createAgentNumber(ev,agentId){ev.preventDefault();let f=Object.fromEntries(new FormData(ev.target)),a=d.agents.find(x=>x.id===agentId),clean=f.number.replace(/\s/g,'');if(d.sims.some(s=>s.number.replace(/\s/g,'')===clean)){alert('This phone number already exists.');return}let at=new Date(f.at).toISOString(),s={id:'s'+Date.now(),number:f.number,msisdn:clean,iccid:'',network:f.network,type:f.type,status:f.status,agent:a.name,agentId:'',team:a.team,assignedAt:at,createdAt:at,balance:0,history:[{at,action:`Added and assigned to ${a.name} · Status set to ${f.status.replaceAll('-',' ')}`,by:signedInName(),note:f.note||'Phone number added from agent profile.'}]};d.sims.unshift(s);audit('Phone number added',s.number,`Assigned to ${a.name} in ${a.team}`);save();modal.classList.remove('show');go('agents')}
</script></body></html>
