<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIMHQ</title><style>:root{--n:#122044;--b:#356cf5;--t:#16213a;--m:#71809a;--l:#e5eaf2;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;font:14px system-ui;color:var(--t);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:7px;padding:9px 12px;font-weight:700}.primary{background:var(--b);color:#fff}.secondary{background:#fff;border:1px solid #d8dfeb}.shell{display:flex;min-height:100vh}.side{width:220px;background:var(--n);color:#c4cde0;padding:24px 13px}.brand{color:white;font-size:21px;font-weight:800;padding:0 10px 24px}.nav{padding:11px 12px;border-radius:7px;margin:4px 0;cursor:pointer}.nav.active,.nav:hover{background:#23365f;color:white}.main{flex:1}.top{height:67px;background:white;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 29px}.content{padding:28px 30px;max-width:1400px;margin:auto}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.head h1{margin:0;font-size:25px}.head p{margin:5px 0 0;color:var(--m)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.stat{background:#fff;border:1px solid var(--l);border-radius:10px}.stat{padding:16px}.label{font-size:11px;color:var(--m);font-weight:800}.num{font-size:28px;font-weight:800;margin-top:9px}.card{padding:19px;margin-top:18px}.toolbar{display:flex;gap:8px;margin-bottom:15px}.field{border:1px solid #dbe2ed;border-radius:7px;padding:9px;flex:1}table{width:100%;border-collapse:collapse}th{text-align:left;background:#f8f9fc;color:#758299;padding:11px;font-size:10px}td{padding:13px;border-top:1px solid #edf0f5;font-size:12px}.tablewrap{overflow:auto}.badge{padding:4px 8px;border-radius:14px;background:#e9efff;color:#285fca}.in_use{background:#e9f8f0;color:#177b50}.blocked,.lost{background:#feeeee;color:#bd4b4c}.modal{display:none;position:fixed;inset:0;background:#0b173280;place-items:center;padding:18px}.modal.show{display:grid}.dialog{width:min(620px,100%);background:white;border-radius:12px}.dhead{padding:19px 22px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between}.form{padding:20px 22px;display:grid;grid-template-columns:1fr 1fr;gap:14px}.form label{font-size:11px;font-weight:800;color:#64718a;display:block;margin-bottom:5px}.form input,.form select,.form textarea{border:1px solid #d9e0ec;width:100%;border-radius:7px;padding:9px}.wide{grid-column:1/-1}.actions{padding:0 22px 20px;display:flex;justify-content:flex-end;gap:8px}.login{max-width:390px;margin:13vh auto;background:#fff;border:1px solid var(--l);border-radius:12px;padding:28px}.login h1{margin:0}.login p{color:var(--m)}.login label{display:block;font-size:12px;font-weight:700;margin:12px 0 5px}.login input{width:100%;padding:10px;border:1px solid #d9e0ec;border-radius:7px}.error{color:#bd4b4c;min-height:20px;margin-top:10px}@media(max-width:700px){.side{width:58px;padding:23px 6px}.brand,.nav{font-size:0}.nav:first-letter{font-size:15px}.content,.top{padding-left:15px;padding-right:15px}.grid{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><div id="root"></div><div class="modal" id="modal"><div class="dialog" id="dialog"></div></div><script>
const root=document.querySelector('#root'),modal=document.querySelector('#modal'),dialog=document.querySelector('#dialog');let token=sessionStorage.getItem('simhq-token'),me=JSON.parse(sessionStorage.getItem('simhq-user')||'null'),state={sims:[],agents:[],usage:[],audit:[]},page='dashboard';const e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dt=x=>x?new Date(x).toLocaleString('en-KE',{dateStyle:'medium',timeStyle:'short'}):'—',write=()=>me?.role!=='agent',badge=s=>`<span class="badge ${e(s)}">${e(String(s).replaceAll('_',' '))}</span>`;
async function api(url,o={}){let r=await fetch(url,{...o,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(o.headers||{})}}),b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.error||'Request failed');return b}function loginScreen(){root.innerHTML=`<main class="login"><h1>SIMHQ</h1><p>Sign in to your SIM management workspace.</p><form onsubmit="login(event)"><label>Username</label><input name="username" required autofocus><label>Password</label><input type="password" name="password" required><div class="error" id="error"></div><button class="primary" style="width:100%">Sign in</button></form></main>`}async function login(ev){ev.preventDefault();try{let r=await api('/api/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(ev.target)))});token=r.token;me=r.user;sessionStorage.setItem('simhq-token',token);sessionStorage.setItem('simhq-user',JSON.stringify(me));await load()}catch(x){error.textContent=x.message}}async function load(){try{state=await api('/api/bootstrap');render()}catch(x){sessionStorage.clear();token=me=null;loginScreen()}}function logout(){sessionStorage.clear();token=me=null;loginScreen()}function go(p){if(p==='users'&&me?.role!=='admin')p='dashboard';page=p;render()}function render(){root.innerHTML=`<div class="shell"><aside class="side"><div class="brand">▣ SIMHQ</div>${[['dashboard','⌂ Dashboard'],['sims','▤ SIM Cards'],['agents','♙ Agents'],['usage','◷ Weekly Usage'],['audit','◉ Audit Log']].map(x=>`<div class="nav ${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</div>`).join('')}</aside><main class="main"><header class="top"><b>${page[0].toUpperCase()+page.slice(1)}</b><span>${e(me.name)} · <button class="secondary" onclick="logout()">Sign out</button></span></header><div class="content" id="app"></div></main></div>`;({dashboard,sims,agents,usage,audit})[page]()}function dashboard(){let c=x=>state.sims.filter(s=>s.status===x).length;app.innerHTML=`<div class="head"><div><h1>SIM operations overview</h1><p>Data is stored in the shared database.</p></div>${write()?'<button class="primary" onclick="newSim()">+ Add SIM card</button>':''}</div><div class="grid"><div class="stat"><div class="label">TOTAL SIMS</div><div class="num">${state.sims.length}</div></div><div class="stat"><div class="label">IN USE</div><div class="num">${c('in_use')}</div></div><div class="stat"><div class="label">AVAILABLE</div><div class="num">${c('available')}</div></div><div class="stat"><div class="label">WEEKLY RECORDS</div><div class="num">${state.usage.length}</div></div></div><div class="card"><h3>Recent activity</h3>${state.audit.slice(0,8).map(a=>`<p><b>${e(a.action)}</b><br><small>${dt(a.at)} · ${e(a.by)}</small></p>`).join('')||'<p>No activity yet.</p>'}</div>`}function sims(){app.innerHTML=`<div class="head"><div><h1>SIM cards</h1><p>Search inventory and update status.</p></div>${write()?'<button class="primary" onclick="newSim()">+ Add SIM card</button>':''}</div><div class="card"><div class="toolbar"><input class="field" id="q" placeholder="Search SIM, ICCID, agent, team, network" oninput="list()"></div><div class="tablewrap"><table><thead><tr><th>SIM NUMBER</th><th>AGENT / TEAM</th><th>NETWORK</th><th>STATUS</th><th>ASSIGNED</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div>`;list()}function list(){let q=document.querySelector('#q').value.toLowerCase(),a=state.sims.filter(s=>[s.number,s.iccid,s.msisdn,s.network,s.agent,s.team].join(' ').toLowerCase().includes(q));rows.innerHTML=a.map(s=>`<tr><td><b>${e(s.number)}</b><br><small>${e(s.iccid||'No ICCID')}</small></td><td>${s.agent?`<b>${e(s.agent)}</b><br><small>${e(s.team)}</small>`:'Unassigned'}</td><td>${e(s.network)}</td><td>${badge(s.status)}</td><td>${dt(s.assignedAt)}</td><td>${write()?`<button class="secondary" onclick="statusForm('${s.id}','${e(s.number)}')">Update</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6">No SIMs found.</td></tr>'}function agents(){app.innerHTML=`<div class="head"><div><h1>Agents</h1><p>Agents currently in the database.</p></div></div><div class="card tablewrap"><table><thead><tr><th>AGENT</th><th>EMPLOYEE ID</th><th>TEAM</th><th>PHONE</th><th>STATUS</th></tr></thead><tbody>${state.agents.map(a=>`<tr><td><b>${e(a.name)}</b></td><td>${e(a.employeeId)}</td><td>${e(a.team||'Unassigned')}</td><td>${e(a.phone||'—')}</td><td>${e(a.status)}</td></tr>`).join('')||'<tr><td colspan="5">No agents yet.</td></tr>'}</tbody></table></div>`}function usage(){app.innerHTML=`<div class="head"><div><h1>Weekly usage</h1><p>Permanent weekly records.</p></div>${write()?'<button class="primary" onclick="usageForm()">+ Record usage</button>':''}</div><div class="card tablewrap"><table><thead><tr><th>WEEK</th><th>SIM / AGENT</th><th>TEAM</th><th>AIRTIME</th><th>DATA MB</th><th>TOTAL</th></tr></thead><tbody>${state.usage.map(u=>`<tr><td>${e(u.week)}</td><td><b>${e(u.number)}</b><br><small>${e(u.agent)}</small></td><td>${e(u.team)}</td><td>KES ${e(u.airtime)}</td><td>${e(u.data)}</td><td>KES ${e(u.total)}</td></tr>`).join('')||'<tr><td colspan="6">No weekly records submitted.</td></tr>'}</tbody></table></div>`}function audit(){app.innerHTML=`<div class="head"><div><h1>Audit log</h1><p>Recorded operational actions.</p></div></div><div class="card tablewrap"><table><thead><tr><th>DATE</th><th>ACTION</th><th>DETAIL</th><th>USER</th></tr></thead><tbody>${state.audit.map(a=>`<tr><td>${dt(a.at)}</td><td><b>${e(a.action)}</b></td><td>${e(a.note)}</td><td>${e(a.by)}</td></tr>`).join('')||'<tr><td colspan="4">No audit records.</td></tr>'}</tbody></table></div>`}function open(h){dialog.innerHTML=h;modal.classList.add('show')}function close(){modal.classList.remove('show');dialog.innerHTML=''}modal.onclick=x=>{if(x.target===modal)close()};document.addEventListener('keydown',x=>{if(x.key==='Escape'&&modal.classList.contains('show'))close()});function newSim(){open(`<div class="dhead"><h2>Add SIM card</h2><button onclick="close()">×</button></div><form class="form" onsubmit="createSim(event)"><div><label>SIM NUMBER *</label><input name="number" required></div><div><label>ICCID</label><input name="iccid"></div><div><label>MSISDN</label><input name="msisdn"></div><div><label>NETWORK *</label><input name="network" required></div><div><label>SIM TYPE</label><input name="type" value="Prepaid"></div><div><label>INITIAL STATUS</label><select name="status"><option value="available">Available</option><option value="pending_activation">Pending activation</option></select></div><div class="wide"><label>NOTES</label><textarea name="notes"></textarea></div><div class="wide actions"><button type="button" class="secondary" onclick="close()">Cancel</button><button class="primary">Save SIM card</button></div></form>`)}async function createSim(x){x.preventDefault();try{await api('/api/sims',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(x.target)))});close();await load();go('sims')}catch(e){alert(e.message)}}function statusForm(id,number){open(`<div class="dhead"><h2>Update status · ${number}</h2><button onclick="close()">×</button></div><form class="form" onsubmit="saveStatus(event,'${id}')"><div class="wide"><label>NEW STATUS</label><select name="status">${['available','in_use','blocked','lost','damaged','suspended','disposed','returned','pending_activation'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="wide"><label>REASON / NOTES</label><textarea name="note" required></textarea></div><div class="wide actions"><button type="button" class="secondary" onclick="close()">Cancel</button><button class="primary">Save change</button></div></form>`)}async function saveStatus(x,id){x.preventDefault();try{await api('/api/sims/'+id+'/status',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(x.target)))});close();await load();go('sims')}catch(e){alert(e.message)}}function usageForm(){open(`<div class="dhead"><h2>Record weekly usage</h2><button onclick="close()">×</button></div><form class="form" onsubmit="saveUsage(event)"><div class="wide"><label>SIM</label><select name="sim">${state.sims.map(s=>`<option value="${s.id}">${e(s.number)} · ${e(s.agent||'Unassigned')}</option>`).join('')}</select></div><div><label>WEEK STARTING</label><input type="date" name="week" required></div><div><label>AIRTIME (KES)</label><input type="number" name="airtime" value="0"></div><div><label>SMS BUNDLE</label><input type="number" name="sms" value="0"></div><div><label>CALLS</label><input type="number" name="calls" value="0"></div><div><label>DATA BUNDLE</label><input type="number" name="bundle" value="0"></div><div><label>DATA USED (MB)</label><input type="number" name="data" value="0"></div><div class="wide"><label>NOTES</label><textarea name="note"></textarea></div><div class="wide actions"><button type="button" class="secondary" onclick="close()">Cancel</button><button class="primary">Save weekly record</button></div></form>`)}async function saveUsage(x){x.preventDefault();try{await api('/api/usage',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(x.target)))});close();await load();go('usage')}catch(e){alert(e.message)}}token?load():loginScreen();
</script><script src="/features.js"></script></body></html>
